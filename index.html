<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="theme-color" content="#06111f">
  <meta name="description" content="プレイヤー不在中も成長し続ける自律工場シミュレーション">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/favicon.ico">
  <link rel="stylesheet" href="factory.css">
  <title>自律クッキー工場</title>
</head>
<body>
  <div class="factory-lights" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="top-panel glass-panel">
      <div>
        <p class="eyebrow">無人工場 管制室</p>
        <h1>自律クッキー工場</h1>
      </div>
      <div class="status-grid" aria-label="工場状態">
        <div><span>稼働状態</span><strong id="statusText">起動中</strong></div>
        <div><span>復帰倍率</span><strong id="burstText">なし</strong></div>
        <div><span>オフライン上限</span><strong id="offlineCapText">--</strong></div>
      </div>
    </header>

    <section class="hero-grid">
      <section class="production-panel glass-panel">
        <div class="counter-card">
          <p>総クッキー</p>
          <strong id="cookieCount">0</strong>
          <span id="perSecond">毎秒 0</span>
        </div>

        <div class="machine-wrap">
          <div class="conveyor" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <button id="manualButton" class="core-machine" type="button" aria-label="手動稼働">
            <span class="machine-glow"></span>
            <span class="gear gear-a">⚙</span>
            <span class="gear gear-b">⚙</span>
            <span class="cookie-core">●</span>
            <span class="press-label">手動稼働</span>
          </button>
          <div id="floatingLayer" class="floating-layer" aria-hidden="true"></div>
        </div>

        <div class="factory-readout">
          <div><span>クリック出力</span><strong id="clickPowerText">1</strong></div>
          <div><span>オフライン効率</span><strong id="offlineEfficiencyText">25%</strong></div>
          <div><span>時間圧縮</span><strong id="timeCompressionText">1.00倍</strong></div>
          <div><span>事故危険度</span><strong id="riskText">0%</strong></div>
        </div>
      </section>

      <aside class="overview-panel glass-panel">
        <h2>工場方針</h2>
        <div id="archetypes" class="archetype-list"></div>
        <h2>稼働ログ</h2>
        <div id="logList" class="log-list" aria-live="polite"></div>
      </aside>
    </section>

    <section class="shop-panel glass-panel">
      <div class="shop-heading">
        <div>
          <p class="eyebrow">拡張ショップ</p>
          <h2>増設計画</h2>
        </div>
        <div class="shop-actions">
          <button id="saveButton" type="button">保存</button>
          <button id="resetButton" type="button">初期化</button>
        </div>
      </div>
      <nav id="categoryTabs" class="category-tabs" aria-label="ショップ分類"></nav>
      <div id="upgradeGrid" class="upgrade-grid"></div>
    </section>
  </main>

  <div id="offlineModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="offlineTitle">
    <div class="offline-modal glass-panel">
      <div class="burst-ring" aria-hidden="true"></div>
      <p class="eyebrow">復帰報告</p>
      <h2 id="offlineTitle">工場復帰完了</h2>
      <p id="offlineDuration">工場は稼働し続けました</p>
      <strong id="offlineGain">+0 クッキー獲得</strong>
      <p id="offlineDetail">自律ラインが蓄積分を搬入しました。</p>
      <button id="offlineClose" type="button">受け取る</button>
    </div>
  </div>

  <template id="upgradeCardTemplate">
    <article class="upgrade-card">
      <div class="upgrade-top">
        <span class="upgrade-icon"></span>
        <div>
          <h3></h3>
          <p></p>
        </div>
      </div>
      <div class="upgrade-meta">
        <span class="upgrade-cost"></span>
        <span class="upgrade-level"></span>
      </div>
      <button type="button" class="buy-button">購入</button>
    </article>
  </template>

  <script src="factory.js" defer></script>
</body>
</html>
